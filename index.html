		<canvas id="maincanvas"></canvas>

		<div id="text">

		<!-- Floating Progress Pill -->
		<div class="floating-progress-pill" id="progressPill">
			<div class="floating-progress-track">
				<div class="floating-progress-fill" id="progressFill"></div>
			</div>
			<span class="floating-progress-text" id="progressText">0%</span>
		</div>
	</div>

	<script src="canvas.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const hamburger = document.getElementById('hamburgerBtn');
			const navMenu = document.getElementById('navMenu');
			if (hamburger && navMenu) {
				hamburger.addEventListener('click', () => {
					hamburger.classList.toggle('open');
					navMenu.classList.toggle('open');
				});
			}

			// Floating Scroll Indicator & Progress Pill Logic
			const scrollIndicator = document.getElementById('scrollIndicator');
			const progressPill = document.getElementById('progressPill');
			const progressFill = document.getElementById('progressFill');
			const progressText = document.getElementById('progressText');

			function handleScroll() {
				const scrollTop = window.scrollY || document.documentElement.scrollTop;
				const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;

				if (scrollHeight > 100) {
					const progress = Math.min(100, Math.max(0, Math.round((scrollTop / scrollHeight) * 100)));
					
					if (progressFill) progressFill.style.width = progress + '%';
					if (progressText) progressText.textContent = progress + '%';

					if (progressPill) {
						if (scrollTop > 50) progressPill.classList.add('visible');
						else progressPill.classList.remove('visible');
					}

					if (scrollIndicator) {
						if (scrollTop < scrollHeight - 120) {
							scrollIndicator.classList.add('visible');
						} else {
							scrollIndicator.classList.remove('visible');
						}
					}
				}
			}

			if (scrollIndicator) {
				scrollIndicator.addEventListener('click', (e) => {
					e.preventDefault();
					window.scrollBy({ top: window.innerHeight * 0.75, behavior: 'smooth' });
				});
			}

			window.addEventListener('scroll', handleScroll, { passive: true });
			handleScroll();
		});
	</script>
</body>
